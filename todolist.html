<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #3498db 50%, #87CEEB 75%, #E0F7FF 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .todo-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      width: 380px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h2 {
      text-align: center;
      color: #1e3c72;
      margin-bottom: 25px;
      font-size: 28px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #3498db;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #1e3c72;
      box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.2);
    }

    input::placeholder {
      color: #87CEEB;
    }

    button {
      padding: 12px 25px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #2a5298, #3498db);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      max-height: 350px;
      overflow-y: auto;
    }

    ul::-webkit-scrollbar {
      width: 6px;
    }

    ul::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    ul::-webkit-scrollbar-thumb {
      background: #3498db;
      border-radius: 10px;
    }

    li {
      background: #f8fbff;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
      border-left: 4px solid #3498db;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    li:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      background: #fff;
    }

    .delete-btn {
      background: #e74c3c;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: #c0392b;
      transform: scale(1.1);
    }

    @media (max-width: 480px) {
      .todo-container {
        width: 100%;
        padding: 20px;
      }
      
      .input-container {
        flex-direction: column;
      }
      
      input {
        margin-bottom: 10px;
      }
    }

    .datetime-inputs {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .datetime-inputs input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    .task-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3498db;
    }

    .task-text {
      flex: 1;
      word-break: break-word;
    }

    .task-text.completed {
      text-decoration: line-through;
      color: #888;
      opacity: 0.7;
    }

    .task-datetime {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
      display: block;
    }

    .task-actions {
      display: flex;
      gap: 5px;
    }

    .edit-btn {
      background: #f39c12;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .edit-btn:hover {
      background: #e67e22;
    }

    .task-info {
      flex: 1;
    }

    .filter-buttons {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px;
      background: #f0f0f0;
      color: #333;
      font-size: 14px;
      box-shadow: none;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(52, 152, 219, 0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #1e3c72;
    }
  </style>
</head>
<body>
  <div class="todo-container">
    <h2>My To-Do List</h2>
    
    <div class="stats" id="stats">
      <span>Total: <span id="totalTasks">0</span></span>
      <span>Completed: <span id="completedTasks">0</span></span>
      <span>Pending: <span id="pendingTasks">0</span></span>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filterTasks('all')" id="filterAll">All</button>
      <button class="filter-btn" onclick="filterTasks('pending')" id="filterPending">Pending</button>
      <button class="filter-btn" onclick="filterTasks('completed')" id="filterCompleted">Completed</button>
    </div>

    <div class="input-container">
      <input type="text" id="taskInput" placeholder="Enter a task">
    </div>
    
    <div class="datetime-inputs">
      <input type="date" id="taskDate">
      <input type="time" id="taskTime" value="12:00">
    </div>
    
    <button onclick="addTask()" style="width: 100%; margin-top: 10px; margin-bottom: 20px;">Add Task</button>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    let currentFilter = 'all';
    let editingId = null;

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      updateStats();
      renderTasks();
    }

    function getCurrentDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return {
        date: `${year}-${month}-${day}`,
        time: `${hours}:${minutes}`
      };
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const dateInput = document.getElementById("taskDate");
      const timeInput = document.getElementById("taskTime");
      
      const taskText = input.value.trim();
      let taskDate = dateInput.value;
      let taskTime = timeInput.value;

      if (taskText === "") {
        alert("Please enter a task");
        return;
      }

      const now = getCurrentDateTime();
      if (!taskDate) taskDate = now.date;
      if (!taskTime) taskTime = now.time;

      if (editingId !== null) {
        const taskIndex = tasks.findIndex(t => t.id === editingId);
        if (taskIndex !== -1) {
          tasks[taskIndex].text = taskText;
          tasks[taskIndex].date = taskDate;
          tasks[taskIndex].time = taskTime;
        }
        editingId = null;
        document.querySelector('button[onclick="addTask()"]').textContent = 'Add Task';
      } else {
        const newTask = {
          id: Date.now(),
          text: taskText,
          date: taskDate,
          time: taskTime,
          completed: false,
          createdAt: new Date().toISOString()
        };
        tasks.push(newTask);
      }

      input.value = "";
      dateInput.value = "";
      timeInput.value = "";
      
      saveTasks();
      input.focus();
    }

    function toggleComplete(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
      }
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        document.getElementById("taskInput").value = task.text;
        document.getElementById("taskDate").value = task.date || '';
        document.getElementById("taskTime").value = task.time || '';
        
        editingId = id;
        document.querySelector('button[onclick="addTask()"]').textContent = 'Update Task';
        document.getElementById("taskInput").focus();
      }
    }

    function removeTask(button) {
      const li = button.closest('li');
      const id = parseInt(li.dataset.id);
      
      if (confirm('Are you sure you want to delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        
        if (editingId === id) {
          editingId = null;
          document.querySelector('button[onclick="addTask()"]').textContent = 'Add Task';
          document.getElementById("taskInput").value = "";
          document.getElementById("taskDate").value = "";
          document.getElementById("taskTime").value = "";
        }
        
        saveTasks();
      }
    }

    function filterTasks(filter) {
      currentFilter = filter;
      
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`).classList.add('active');
      
      renderTasks();
    }

    function getFilteredTasks() {
      switch(currentFilter) {
        case 'completed':
          return tasks.filter(t => t.completed);
        case 'pending':
          return tasks.filter(t => !t.completed);
        default:
          return tasks;
      }
    }

    function updateStats() {
      document.getElementById('totalTasks').textContent = tasks.length;
      document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
      document.getElementById('pendingTasks').textContent = tasks.filter(t => !t.completed).length;
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'No date';
      const [year, month, day] = dateStr.split('-');
      return `${day}/${month}/${year}`;
    }

    function formatTime(timeStr) {
      if (!timeStr) return '';
      return timeStr;
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      const filteredTasks = getFilteredTasks();
      
      if (filteredTasks.length === 0) {
        taskList.innerHTML = '<li style="justify-content: center; color: #666;">No tasks found</li>';
        return;
      }

      taskList.innerHTML = filteredTasks.map(task => {
        const dateStr = task.date ? formatDate(task.date) : '';
        const timeStr = task.time ? formatTime(task.time) : '';
        const dateTimeStr = dateStr || timeStr ? 
          `<small class="task-datetime">📅 ${dateStr} ${timeStr ? '⏰ ' + timeStr : ''}</small>` : '';
        
        return `
          <li data-id="${task.id}">
            <div style="display: flex; align-items: flex-start; gap: 10px; width: 100%;">
              <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} 
                     onchange="toggleComplete(${task.id})">
              <div class="task-info" style="flex: 1;">
                <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                ${dateTimeStr}
              </div>
              <div class="task-actions">
                <button class="edit-btn" onclick="editTask(${task.id})" style="padding: 5px 8px; font-size: 12px;">✏️</button>
                <button class="delete-btn" onclick="removeTask(this)" style="padding: 5px 8px; font-size: 12px;">❌</button>
              </div>
            </div>
          </li>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
      const now = getCurrentDateTime();
      document.getElementById('taskDate').value = now.date;
      document.getElementById('taskTime').value = now.time;
      renderTasks();
      updateStats();
    });
  </script>
</body>
</html>
